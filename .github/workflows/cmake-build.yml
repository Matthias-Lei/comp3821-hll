name: cmake build

on: [push]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Configure
              run: cmake -S . -B build

            - name: Build
              run: cmake --build build

            - name: Test
              run: cmake --test-dir build --output-on-failure
