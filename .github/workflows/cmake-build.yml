name: cmake build

on: [push]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Configure
              run: cmake -S . -B build

            - name: Build
              run: cmake --build build

            - name: Run create_test_streams.py
              run: python3 -u python/create_test_streams.py --make-directories --remote

            - name: Test
              run: ctest --test-dir build --output-on-failure
